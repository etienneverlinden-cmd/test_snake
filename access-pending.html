<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access pending — My Pragmatict</title>
  <link rel="icon" href="assets/pragmatict-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="assets/pragmatict-logo.png" alt="PragmatICT">
      </div>
      <h2 class="auth-title">Access pending</h2>
      <p class="auth-hint">
        Your request was sent for approval. You will receive an email when access is granted.
        This page refreshes automatically.
      </p>
      <button type="button" class="btn btn-link" id="signOutBtn">Sign out</button>
    </div>
  </main>
  <script src="js/convex-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-guard.js"></script>
  <script>
    (async function () {
      await (window.ArcadeAuthGuard && window.ArcadeAuthGuard.ready);
      document.getElementById('signOutBtn').addEventListener('click', async () => {
        await window.ArcadeAuth.signOut();
        window.location.href = 'index.html';
      });
      setInterval(async () => {
        try {
          const result = await window.ArcadeAuth.callMutation('access:ensureAndGet', {});
          if (result && result.status === 'approved') {
            window.location.replace('arcade.html');
          } else if (result && result.status === 'denied') {
            window.location.replace('access-denied.html');
          } else if (result && result.status === 'unauthorized') {
            window.location.replace('access-blocked.html');
          }
        } catch (_) { /* ignore */ }
      }, 8000);
    })();
  </script>
</body>
</html>
